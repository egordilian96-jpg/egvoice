services:
  # ==================================================
  # EG Voice: приложение (Express API + фронт + WS)
  # ==================================================
  app:
    build: .
    container_name: egv-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET}
      # LiveKit — контейнер по имени сервиса виден из app по внутренней сети:
      # для сервера токенов достаточно ключей, url клиент получит из /api/livekit/token
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - egv-data:/data
    expose:
      - "5000"
    depends_on:
      - livekit

  # ==================================================
  # LiveKit SFU (self-hosted)
  # ==================================================
  livekit:
    image: livekit/livekit-server:v1.7
    container_name: egv-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # LiveKit требует host-режим сети или явных портов.
    # UDP-порты для WebRTC — весь диапазон 50000-50100:
    ports:
      - "7880:7880"     # WebSocket signal (потом за Caddy)
      - "7881:7881"     # TCP fallback для WebRTC
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  # ==================================================
  # Caddy — TLS терминация + reverse proxy
  # ==================================================
  caddy:
    image: caddy:2
    container_name: egv-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - livekit

volumes:
  egv-data:
  caddy-data:
  caddy-config:
