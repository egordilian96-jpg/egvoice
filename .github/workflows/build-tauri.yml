name: Build EG Voice — Windows

# Собираем .exe/.msi инсталлятор при пуше тега вида v* (например v0.1.0)
# или руками из вкладки Actions → «Run workflow»
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы workflow мог создать GitHub Release

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Windows MSI + NSIS)
        uses: tauri-apps/tauri-action@v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EG Voice ${{ github.ref_name }}"
          releaseBody: |
            **EG Voice ${{ github.ref_name }} — Windows**

            Скачай `EG-Voice_*.msi` ниже и запусти. Установщик проведёт по шагам.

            Минимальные требования: Windows 10 / 11 (64-bit), WebView2 (уже есть в Win10+).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
