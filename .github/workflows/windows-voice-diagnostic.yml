name: EG Voice - native voice diagnostic
on:
  push:
    branches: [computer/windows-0.2.0]
    paths:
      - tests/windows-voice.cjs
      - .github/workflows/windows-voice-diagnostic.yml
permissions:
  contents: read
  actions: read
jobs:
  native-voice:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      VITE_API_URL: https://egvoice.pplx.app/port/5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: egvoice-windows-4-696c1806a68969fd6b8474701f78950acb1b0adc
          run-id: 36240567038
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Install exact 0.2.2 candidate
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "candidate/EG Voice_0.2.2_x64-setup.exe"
          $target = Join-Path $env:RUNNER_TEMP "egvoice-installed"
          $setup = Start-Process $exe -ArgumentList @("/S", "/D=$target") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exit: $($setup.ExitCode)" }
          # Hosted runner is elevated: current WebView2 ignores env/HKCU flags.
          # App-scoped HKLM policy is allowed, on this disposable runner only.
          $key = "HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $key -Force | Out-Null
          $flags = "--remote-debugging-port=9222 --use-fake-device-for-media-stream --use-fake-ui-for-media-stream --autoplay-policy=no-user-gesture-required"
          New-ItemProperty -Path $key -Name "eg-voice.exe" -Value $flags -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name "ru.egvoice.app" -Value $flags -PropertyType String -Force | Out-Null
      - name: Real native publication via auto and TURN
        run: node tests/windows-voice.cjs
      - name: Remove runner-only debugging policy
        if: always()
        shell: pwsh
        run: |
          $key = "HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          Remove-ItemProperty -Path $key -Name "eg-voice.exe","ru.egvoice.app" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-voice-diagnostic
          path: windows-diagnostics/native-voice-result.json
          retention-days: 7
